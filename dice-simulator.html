<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サイコロ確率検証</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--sub:#94a3b8;--red:#e11d48;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px;display:flex;justify-content:center}
.app{width:min(100%,620px)}
h1{text-align:center;font-size:24px;margin:8px 0 6px}
.sub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px}
.ticker{background:#881337;border:1px solid #f43f5e;border-radius:10px;padding:10px 12px;margin-bottom:16px;color:#ffe4e6;font-size:13px;font-weight:700;line-height:1.5}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.stage{position:relative;height:210px;overflow:hidden;border-radius:14px;background:linear-gradient(180deg,#172033,#0f172a);margin-bottom:8px}
.floor{position:absolute;left:8%;right:8%;bottom:28px;height:5px;border-radius:99px;background:#334155;box-shadow:0 10px 18px rgba(0,0,0,.55)}
.dice-wrap{position:absolute;width:92px;height:92px;left:calc(50% - 46px);bottom:34px;will-change:transform}
.dice-wrap.rolling{animation:rollAcross 1.35s cubic-bezier(.2,.7,.2,1) both}
@keyframes rollAcross{
0%{transform:translate3d(-155px,0,0) rotate(0deg) scale(.94)}
16%{transform:translate3d(-108px,-52px,0) rotate(125deg) scale(1.02)}
34%{transform:translate3d(-52px,0,0) rotate(270deg) scale(.98)}
51%{transform:translate3d(6px,-38px,0) rotate(425deg) scale(1.02)}
68%{transform:translate3d(62px,0,0) rotate(585deg) scale(.99)}
83%{transform:translate3d(105px,-17px,0) rotate(690deg)}
100%{transform:translate3d(128px,0,0) rotate(720deg)}
}
.dice{width:92px;height:92px;border-radius:18px;background:#fff;border:2px solid #cbd5e1;box-shadow:inset 0 0 12px rgba(0,0,0,.08),0 16px 24px rgba(0,0,0,.32);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px}
.pip{width:17px;height:17px;border-radius:50%;background:#334155;align-self:center;justify-self:center;visibility:hidden}
.pip.red{background:var(--red)}
.result{text-align:center;min-height:28px;font-size:18px;font-weight:800;margin:8px 0 14px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
button{appearance:none;border:0;border-radius:11px;padding:14px 10px;font-size:16px;font-weight:800;color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
button:disabled{opacity:.55}
#rollBtn{background:var(--blue)}
#roll100Btn{background:var(--red)}
#resetBtn{background:#475569;grid-column:1/-1}
.stats{background:#0f172a;border-radius:12px;padding:13px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.stat{background:#1e293b;border-radius:9px;padding:10px 6px;text-align:center}
.label{font-size:11px;color:var(--sub);line-height:1.3}
.value{margin-top:5px;font-size:18px;font-weight:800;color:#38bdf8}
.row{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.track{height:15px;background:#334155;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:#38bdf8;border-radius:99px;transition:width .25s}
.fill.one{background:var(--red)}
.count{text-align:right}
@media(max-width:420px){.dice-wrap{width:84px;height:84px;left:calc(50% - 42px)}.dice{width:84px;height:84px}.pip{width:15px;height:15px}.stage{height:195px}}
</style>
</head>
<body>
<div class="app">
<h1>🎲 サイコロシミュレーター</h1>
<div class="sub">転がる演出つき・出目を自動集計</div>
<div class="ticker">🚨 10回連続で「1」が出る確率：約1/60,466,176（約6,046万分の1）</div>
<div class="card">
<div class="stage">
<div class="floor"></div>
<div class="dice-wrap" id="diceWrap">
<div class="dice" id="dice">
<span class="pip" data-pos="1"></span><span class="pip" data-pos="2"></span><span class="pip" data-pos="3"></span>
<span class="pip" data-pos="4"></span><span class="pip" data-pos="5"></span><span class="pip" data-pos="6"></span>
<span class="pip" data-pos="7"></span><span class="pip" data-pos="8"></span><span class="pip" data-pos="9"></span>
</div>
</div>
</div>
<div class="result" id="result">ボタンを押してスタート</div>
<div class="buttons">
<button id="rollBtn" type="button">1回振る</button>
<button id="roll100Btn" type="button">100回試行</button>
<button id="resetBtn" type="button">リセット</button>
</div>
<div class="stats">
<div class="summary">
<div class="stat"><div class="label">現在の「1」連続</div><div class="value" id="currentStreak">0 回</div></div>
<div class="stat"><div class="label">「1」の最高連続</div><div class="value" id="maxStreak">0 回</div></div>
<div class="stat"><div class="label">総試行回数</div><div class="value" id="totalRolls">0 回</div></div>
</div>
<div id="chart"></div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var counts=[0,0,0,0,0,0],total=0,current=0,max=0,busy=false;
var wrap=document.getElementById('diceWrap');
var result=document.getElementById('result');
var rollBtn=document.getElementById('rollBtn');
var roll100Btn=document.getElementById('roll100Btn');
var resetBtn=document.getElementById('resetBtn');
var pips=[].slice.call(document.querySelectorAll('.pip'));
var faces={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function showFace(n){
 pips.forEach(function(p){p.style.visibility='hidden';p.classList.remove('red')});
 faces[n].forEach(function(pos){var p=document.querySelector('.pip[data-pos="'+pos+'"]');p.style.visibility='visible';if(n===1)p.classList.add('red')});
}
function initChart(){
 var c=document.getElementById('chart');c.innerHTML='';
 for(var i=1;i<=6;i++)c.insertAdjacentHTML('beforeend','<div class="row"><div>出目 '+i+'</div><div class="track"><div id="bar-'+i+'" class="fill '+(i===1?'one':'')+'"></div></div><div class="count" id="count-'+i+'">0回</div></div>');
}
function add(n){total++;counts[n-1]++;if(n===1){current++;if(current>max)max=current}else current=0}
function update(){
 document.getElementById('totalRolls').textContent=total+' 回';
 document.getElementById('currentStreak').textContent=current+' 回';
 document.getElementById('maxStreak').textContent=max+' 回';
 var m=Math.max.apply(null,counts.concat([1]));
 for(var i=1;i<=6;i++){document.getElementById('bar-'+i).style.width=((counts[i-1]/m)*100)+'%';document.getElementById('count-'+i).textContent=counts[i-1]+'回'}
}
function randomFace(){return Math.floor(Math.random()*6)+1}
function setBusy(v){busy=v;rollBtn.disabled=v;roll100Btn.disabled=v}
function animateTo(face,done){
 wrap.classList.remove('rolling');
 void wrap.offsetWidth;
 wrap.classList.add('rolling');
 setTimeout(function(){wrap.classList.remove('rolling');showFace(face);if(done)done()},1370);
}
function rollOne(){
 if(busy)return;setBusy(true);var n=randomFace();result.textContent='転がり中…';add(n);update();animateTo(n,function(){result.textContent='出目は '+n+' ！';setBusy(false)});
}
function roll100(){
 if(busy)return;setBusy(true);var n=1;for(var i=0;i<100;i++){n=randomFace();add(n)}update();result.textContent='100回まとめて試行中…';animateTo(n,function(){result.textContent='100回試行完了！ 最後の出目は '+n;setBusy(false)});
}
function reset(){counts=[0,0,0,0,0,0];total=0;current=0;max=0;update();showFace(1);result.textContent='リセットしました'}
rollBtn.addEventListener('click',rollOne,false);
roll100Btn.addEventListener('click',roll100,false);
resetBtn.addEventListener('click',reset,false);
initChart();update();showFace(1);
})();
</script>
</body>
</html>
