<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GENBA MEMORY｜QR写真実証</title>
  <style>
:root{
  color-scheme:light;
  --ink:#0f172a;--muted:#64748b;--line:#dbe3ec;--bg:#f4f7fb;--card:#fff;
  --accent:#0f5bd8;--accent2:#eaf2ff;--ok:#0f766e;--warn:#b45309;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}.shell{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.topbar h1{font-size:24px;margin:4px 0 0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 30px rgba(15,23,42,.06);margin-bottom:14px}
.hero{padding:6px 2px 18px}.hero h2{font-size:30px;line-height:1.18;margin:0 0 10px}.hero p,.muted{color:var(--muted);line-height:1.7}.step{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:var(--accent2);color:var(--accent);font-weight:800;margin-right:8px}
.label{font-size:13px;font-weight:800;display:block;margin-bottom:8px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 15px;outline:none}.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,91,216,.1)}
.filebox{display:block;border:2px dashed #b8c6d8;border-radius:18px;padding:22px 16px;text-align:center;background:#fbfdff;font-weight:800;cursor:pointer}.filebox input{display:none}.preview{margin-top:14px;border-radius:18px;overflow:hidden;background:#e8edf4;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}.preview img{width:100%;height:100%;object-fit:cover}.preview-empty{color:var(--muted);font-size:13px}
.primary,.secondary,.ghost{border:0;border-radius:14px;padding:14px 16px;font-weight:800;cursor:pointer}.primary{width:100%;background:var(--accent);color:#fff}.secondary{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.small{padding:9px 11px;font-size:12px}.primary:disabled{opacity:.45;cursor:not-allowed}
.status{display:flex;gap:10px;align-items:flex-start;background:#effcf8;border:1px solid #bce6db;border-radius:16px;padding:13px 14px;margin-bottom:14px;color:#115e59}.status b{display:block;margin-bottom:3px}.status small{line-height:1.5}
.qr-wrap{display:flex;justify-content:center;padding:18px;background:#fff;border:1px solid var(--line);border-radius:18px}.qr-wrap img{width:min(78vw,300px);height:auto;image-rendering:pixelated}.urlbox{font-size:12px;word-break:break-all;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;color:#475569}
.photo-view{border-radius:22px;overflow:hidden;background:#e7edf5;border:1px solid var(--line)}.photo-view img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;background:#111827}.viewer-title{font-size:26px;margin:0 0 6px}.viewer-meta{color:var(--muted);font-size:13px}.note{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:#f8fbff;border-radius:0 12px 12px 0;line-height:1.6}.warning{background:#fff8ed;border:1px solid #f5d6a8;border-radius:16px;padding:14px;color:#92400e;line-height:1.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{margin:0}.only-print{display:none}
@media print{
  body{background:#fff}.shell{max-width:none;padding:0}.topbar,.no-print{display:none!important}.only-print{display:block}.card{box-shadow:none;border:0;padding:0}.qr-wrap{border:0;padding:12px}.qr-wrap img{width:70mm}.print-label{text-align:center;font-size:18pt;font-weight:800;margin-top:8mm}.print-sub{text-align:center;font-size:10pt;color:#444;margin-top:3mm}
}

</style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GENBA MEMORY / POC 0.3</div>
        <h1>QR写真実証</h1>
      </div>
      <button id="homeBtn" class="ghost small" type="button">最初へ</button>
    </header>
    <section id="app" aria-live="polite"></section>
  </main>
  <script>
const STORAGE_KEY = 'genba_memory_poc_v03_places';
const app = document.querySelector('#app');
const homeBtn = document.querySelector('#homeBtn');

function loadPlaces(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; }
  catch { return {}; }
}
function savePlaces(places){ localStorage.setItem(STORAGE_KEY, JSON.stringify(places)); }
function esc(s=''){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function randomId(){
  const a = new Uint32Array(2); crypto.getRandomValues(a);
  return 'gm-' + [...a].map(x=>x.toString(36)).join('');
}
function placeUrl(id){
  const base = location.origin + location.pathname;
  return `${base}?place=${encodeURIComponent(id)}`;
}
function qrUrl(text){
  return `https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=18&ecc=M&data=${encodeURIComponent(text)}`;
}
function setQuery(id){
  const u = new URL(location.href); if(id) u.searchParams.set('place', id); else u.searchParams.delete('place');
  history.pushState({},'',u); render();
}

async function compressImage(file){
  const bitmap = await createImageBitmap(file);
  const maxSide = 1200;
  let {width, height} = bitmap;
  const scale = Math.min(1, maxSide / Math.max(width,height));
  width = Math.round(width*scale); height = Math.round(height*scale);
  const canvas = document.createElement('canvas'); canvas.width=width; canvas.height=height;
  const ctx = canvas.getContext('2d'); ctx.drawImage(bitmap,0,0,width,height); bitmap.close?.();
  let quality = .78;
  let data = canvas.toDataURL('image/jpeg', quality);
  while(data.length > 900000 && quality > .45){ quality -= .08; data = canvas.toDataURL('image/jpeg', quality); }
  return data;
}

function renderRegister(){
  app.innerHTML = `
    <div class="hero no-print">
      <h2>まず1か所だけ、<br>本当に試す。</h2>
      <p>場所を撮影し、その写真を呼び出すQRを作ります。QRを印刷して現場に貼り、同じiPhoneで読み取って写真が出れば第一段階クリアです。</p>
    </div>
    <div class="card no-print">
      <label class="label"><span class="step">1</span>場所名</label>
      <input id="name" class="input" maxlength="50" placeholder="例：工具棚A / 台車1号" />
    </div>
    <div class="card no-print">
      <label class="label"><span class="step">2</span>正しい状態を撮影</label>
      <label class="filebox">📷 写真を撮る / 選ぶ<input id="photo" type="file" accept="image/*" capture="environment"></label>
      <div id="preview" class="preview"><div class="preview-empty">ここに撮った写真が出ます</div></div>
    </div>
    <div class="card no-print">
      <label class="label"><span class="step">3</span>ひとこと（任意）</label>
      <input id="note" class="input" maxlength="60" placeholder="例：右から順番に戻してください" />
    </div>
    <button id="make" class="primary no-print" disabled>QRコードを作る</button>
    <p class="muted no-print" style="font-size:12px">※ この0.3は「同じiPhoneでの実証」専用です。写真は端末内に保存され、別のスマホからはまだ見えません。</p>`;

  const name = document.querySelector('#name'); const photo = document.querySelector('#photo');
  const note = document.querySelector('#note'); const preview = document.querySelector('#preview'); const make = document.querySelector('#make');
  let imageData = '';
  const update = ()=>{ make.disabled = !(name.value.trim() && imageData); };
  name.addEventListener('input', update);
  photo.addEventListener('change', async e=>{
    const f=e.target.files?.[0]; if(!f) return;
    preview.innerHTML='<div class="preview-empty">写真を準備中…</div>';
    try{
      imageData = await compressImage(f);
      preview.innerHTML=`<img src="${imageData}" alt="撮影した正解状態">`; update();
    }catch(err){ preview.innerHTML='<div class="preview-empty">写真の読み込みに失敗しました</div>'; console.error(err); }
  });
  make.addEventListener('click',()=>{
    const id=randomId(); const places=loadPlaces();
    places[id]={id,name:name.value.trim(),note:note.value.trim(),image:imageData,createdAt:new Date().toISOString()};
    try{ savePlaces(places); setQuery(id); }
    catch(e){ alert('写真サイズが大きく、端末保存に失敗しました。別の写真でもう一度お試しください。'); }
  });
}

function renderViewer(id, place){
  app.innerHTML = `
    <div class="status no-print"><div>✓</div><div><b>QRから写真を呼び出せました</b><small>第一段階の実証成功です。</small></div></div>
    <div class="card">
      <h2 class="viewer-title">${esc(place.name)}</h2>
      <div class="viewer-meta">登録写真 / GENBA MEMORY POC 0.3</div>
      <div class="photo-view" style="margin-top:14px"><img src="${place.image}" alt="${esc(place.name)} の正解状態"></div>
      ${place.note ? `<div class="note">💬 ${esc(place.note)}</div>` : ''}
    </div>
    <div class="card no-print">
      <div class="label">この場所のQR</div>
      <div class="qr-wrap"><img src="${qrUrl(placeUrl(id))}" alt="場所QR"></div>
      <div class="urlbox" style="margin-top:12px">${esc(placeUrl(id))}</div>
      <div class="actions">
        <button id="print" class="primary">QRを印刷</button>
        <button id="copy" class="secondary">URLコピー</button>
      </div>
      <button id="new" class="secondary">別の場所を登録</button>
    </div>
    <div class="only-print">
      <div class="qr-wrap"><img src="${qrUrl(placeUrl(id))}" alt="場所QR"></div>
      <div class="print-label">${esc(place.name)}</div>
      <div class="print-sub">GENBA MEMORY / QRをスマホのカメラで読み取ってください</div>
    </div>`;
  document.querySelector('#print')?.addEventListener('click',()=>window.print());
  document.querySelector('#copy')?.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(placeUrl(id)); alert('URLをコピーしました'); }
    catch{ prompt('このURLをコピーしてください',placeUrl(id)); }
  });
  document.querySelector('#new')?.addEventListener('click',()=>setQuery(null));
}

function renderMissing(){
  app.innerHTML = `<div class="card">
    <h2>このスマホには写真がありません</h2>
    <div class="warning">第一段階0.3では写真を撮ったiPhoneの中にだけ保存しています。<br><br>別のスマホで読めるようにするのは、次の段階でSupabaseへ写真を保存すると実現できます。</div>
    <button id="back" class="primary" style="margin-top:14px">このスマホで場所を登録する</button>
  </div>`;
  document.querySelector('#back').addEventListener('click',()=>setQuery(null));
}

function render(){
  const id=new URLSearchParams(location.search).get('place');
  if(!id){ renderRegister(); return; }
  const place=loadPlaces()[id]; if(!place){ renderMissing(); return; }
  renderViewer(id,place);
}
homeBtn.addEventListener('click',()=>setQuery(null));
window.addEventListener('popstate',render);
render();

</script>
</body>
</html>
