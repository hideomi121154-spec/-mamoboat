name: Test MAMO BOAT

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamo-boat-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax
        run: |
          node --check app.js
          node --check core.js
          node --check pilot-config.js
          node --check master-room.js
          node --check mamokamo.js
          node --check dev/mamo-shop-marketplace.js
          node --check dev/mamo-shop-record-benefits.js
          node --check dev/home-record-balance.js
          node --check dev/bet-review-flow.js
          node --check dev/behavior-science.js
          node --check tests/master-room.test.js
          node --check tests/mamokamo-asset.test.js
          python -m py_compile scripts/sync_official_data.py scripts/fallback_openapi.py tests/test_sync_transform.py tests/test_result_validation.py tests/test_fallback_openapi.py tests/smoke_live_results.py

      - name: Run JavaScript tests
        run: |
          node tests/logic.test.js
          node tests/app-smoke.test.js
          node tests/master-room.test.js
          node tests/mamokamo-asset.test.js
          node tests/ios-navigation-regression.test.js
          node tests/ios-race-event-loop-regression.test.js
          node --test dev/tests/editorial-layout.test.js
          node --test dev/tests/brand-theme.test.js
          node --test dev/tests/shop-coupon.test.js
          node --test dev/tests/mamo-record-timing.test.js
          node --test dev/tests/behavior-science.test.js

      - name: Run Python tests
        run: python -m unittest discover -s tests -v
