name: Test Air Boat

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-boat-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax
        run: |
          node --check app.js
          node --check core.js
          python -m py_compile scripts/sync_official_data.py tests/test_sync_transform.py tests/test_result_validation.py tests/smoke_live_results.py

      - name: Run JavaScript tests
        run: node tests/logic.test.js

      - name: Run Python tests
        run: python -m unittest discover -s tests -v
