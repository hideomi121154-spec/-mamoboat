name: One-shot pressroom membership refactor

on:
  push:
    branches:
      - agent/extract-pressroom-membership

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/extract-pressroom-membership
          fetch-depth: 0

      - name: Extract membership controller
        run: python .github/scripts/refactor_pressroom_membership.py

      - name: Validate extracted module
        run: |
          node --check dev/app.js
          node --check dev/pressroom-membership.js
          node --check dev/pilot-config.js
          node --check dev/sw-refresh.js
          node --check dev/sw.js
          node --test dev/tests/pressroom-membership-module.test.js
          node tests/logic.test.js
          node tests/app-smoke.test.js
          node tests/ios-navigation-regression.test.js
          node tests/ios-race-event-loop-regression.test.js
          node --test dev/tests/editorial-layout.test.js
          node --test dev/tests/brand-theme.test.js
          node --test dev/tests/behavior-science.test.js

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-pressroom-membership.yml .github/scripts/refactor_pressroom_membership.py
          git add -A
          git diff --cached --check
          git commit -m "Extract pressroom membership controller"
          git push origin HEAD:agent/extract-pressroom-membership
