name: Fix plan selection scroll position

on:
  push:
    paths:
      - '.github/workflows/fix-plan-scroll-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve scroll on plan selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    save();
    window.closeModal();
    renderAll();
    window.go("analysis");
  };'''
          new='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const scrollTop = window.scrollY;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => window.scrollTo({ top: scrollTop, left: 0, behavior: "instant" }));
  };'''
          if old not in s:
              raise SystemExit('selectPilotPlan block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('app.js?v=20260817-31','app.js?v=20260817-32')
          idx.write_text(h,encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Preserve scroll position when switching membership plan"
          git push
