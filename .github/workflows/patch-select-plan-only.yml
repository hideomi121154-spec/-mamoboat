name: Patch select plan only
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch selectPilotPlan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = '''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const scrollTop = window.scrollY;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => window.scrollTo(0, scrollTop));
  };'''
          new = '''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    save();
    window.closeModal();
    const plan = pressPlan();
    const badge = $("pressPlanBadge");
    if (badge) badge.textContent = `${plan.label} / ${plan.name}`;
    renderMembershipPanel();
    renderPressSettings();
  };'''
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: node --check app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Make plan selection partial update" || exit 0
          git push
