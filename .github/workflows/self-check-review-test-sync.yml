name: Update SELF CHECK review test

on:
  push:
    branches:
      - feature/self-check-phase1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-check-phase1
          fetch-depth: 0
      - name: Patch review DOM test
        run: python tools/update_self_check_review_test.py
      - name: Validate focused tests
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mamo-record-tests" --no-save --no-package-lock jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/mamo-record-tests/node_modules" node tests/air-bet-review-flow.test.js
          node dev/tests/self-check-phase1.test.js
      - name: Commit test update
        shell: bash
        run: |
          git config user.name 'mamoboat-self-check-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/self-check-review-test-sync.yml tools/update_self_check_review_test.py
          git add tests/air-bet-review-flow.test.js
          git commit -m 'test: require SELF CHECK before final AIR BET confirmation'
          git push origin HEAD:feature/self-check-phase1
