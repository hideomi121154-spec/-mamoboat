name: Bump plan selection assets

on:
  push:
    paths:
      - '.github/workflows/bump-plan-selection-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('styles.css?v=20260815-11','styles.css?v=20260817-31')
          s=s.replace('app.js?v=20260817-30','app.js?v=20260817-31')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh membership selection assets"
          git push
