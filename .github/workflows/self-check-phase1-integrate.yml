name: Integrate SELF CHECK Phase 1

on:
  push:
    branches:
      - feature/self-check-phase1

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-check-phase1
          fetch-depth: 0

      - name: Apply canonical integration
        run: python tools/apply_self_check_phase1.py

      - name: Validate ownership boundaries
        shell: bash
        run: |
          node --check dev/app.js
          node --check dev/bet-review-flow.js
          grep -q 'selfConfidence' dev/app.js
          grep -q 'self_stake_feeling' dev/app.js
          grep -q 'data-mamo-self-check' dev/bet-review-flow.js
          grep -q 'air-bet-review-compact.css?v=20260914-1' dev/index.html
          grep -q 'app.js?v=20260914-1' dev/index.html
          if grep -Eq 'SELF_CHECK_STORE_KEY|pre_bet_self_check_recorded|function finalizeSelfCheck' dev/bet-review-flow.js; then
            echo 'ERROR: parallel SELF CHECK persistence remains in review owner'
            exit 1
          fi
          if grep -Eq 'window\.placeBet[[:space:]]*=' dev/bet-review-flow.js; then
            echo 'ERROR: review owner must not replace placeBet()'
            exit 1
          fi

      - name: Commit integrated implementation
        shell: bash
        run: |
          git config user.name 'mamoboat-self-check-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/self-check-phase1-integrate.yml tools/apply_self_check_phase1.py
          git add dev/app.js dev/bet-review-flow.js dev/air-bet-review-compact.css dev/index.html
          git commit -m 'refactor: persist SELF CHECK through canonical AIR BET record'
          git push origin HEAD:feature/self-check-phase1
