name: Refactor plan selection to partial update
on:
  push:
    paths:
      - '.github/workflows/refactor-plan-partial-update-20260818.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch core app directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const scrollTop = window.scrollY;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => window.scrollTo(0, scrollTop));
  };'''
          new='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    save();
    window.closeModal();
    const plan = pressPlan();
    const badge = $("pressPlanBadge");
    if (badge) badge.textContent = `${plan.label} / ${plan.name}`;
    renderMembershipPanel();
    renderPressSettings();
  };'''
          if old not in s:
            raise SystemExit('core target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Bump app cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260818-42', s)
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check app.js
      - name: Commit core fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Remove press plan rerender and scroll restoration" || exit 0
          git push
# trigger 4
