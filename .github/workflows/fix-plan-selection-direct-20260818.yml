name: Fix plan selection direct 20260818
on:
  push:
    paths:
      - '.github/workflows/fix-plan-selection-direct-20260818.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove pressroom repaint and scroll restore
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const scrollTop = window.scrollY;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => window.scrollTo(0, scrollTop));
  };'''
          new='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    save();
    window.closeModal();
    const plan = pressPlan();
    const badge = $("pressPlanBadge");
    if (badge) badge.textContent = `${plan.label} / ${plan.name}`;
    renderMembershipPanel();
    renderPressSettings();
  };'''
          if old not in s:
            raise SystemExit('target plan block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Bump app cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s2=re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260818-10', s, count=1)
          if s2 == s:
            raise SystemExit('app.js cache key not found')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Stop plan selection from moving pressroom" || exit 0
          git push