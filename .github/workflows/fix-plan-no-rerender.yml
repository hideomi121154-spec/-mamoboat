name: Fix plan no rerender

on:
  push:
    paths:
      - '.github/workflows/fix-plan-no-rerender.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch plan selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const scrollTop = window.scrollY;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => window.scrollTo(0, scrollTop));
  };'''
          new = '''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    save();
    window.closeModal();
    renderMembershipPanel();
    const badge = $("pressPlanBadge");
    if (badge) {
      const plan = pressPlan();
      badge.textContent = `${plan.label} / ${plan.name}`;
    }
  };'''
          if old not in s:
              raise SystemExit('plan selection block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = h.replace('app.js?v=20260817-32', 'app.js?v=20260817-34')
          idx.write_text(h, encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Avoid rerender jump when selecting membership plan"
          git push
