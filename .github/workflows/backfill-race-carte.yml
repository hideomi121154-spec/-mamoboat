name: Backfill Race Carte history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backfill_race_carte_history.py"
      - "scripts/race_carte_official_v2.py"
      - ".github/workflows/backfill-race-carte.yml"
  schedule:
    - cron: "8,38 0-14 * * *"

permissions:
  contents: write

concurrency:
  group: mamoboat-race-carte-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate backfill parser
        run: |
          python -m py_compile scripts/enrich_race_carte_data.py
          python -m py_compile scripts/race_carte_official_v2.py
          python -m py_compile scripts/backfill_race_carte_history.py

      - name: Backfill recent same-day races
        run: python scripts/backfill_race_carte_history.py --hours 8 --max-races 96 --workers 8

      - name: Mirror data into dev
        run: |
          mkdir -p dev/data
          cp -a data/. dev/data/

      - name: Commit enriched data
        run: |
          git config user.name "mamoboat-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dev/data
          if git diff --cached --quiet; then
            echo "No race-carte backfill changes"
            exit 0
          fi
          git commit -m "Backfill Race Carte official details"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
