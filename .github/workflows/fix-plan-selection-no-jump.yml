name: Fix plan selection no jump
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-plan-selection-no-jump.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = '''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const scrollTop = window.scrollY;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => window.scrollTo(0, scrollTop));
  };'''
          new = '''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    save();
    window.closeModal();

    // Keep the current reading position stable. Updating the whole pressroom here
    // changes content height above the membership cards and makes iOS jump.
    const plan = pressPlan();
    const badge = $("pressPlanBadge");
    if (badge) badge.textContent = `${plan.label} / ${plan.name}`;
    renderMembershipPanel();
    renderPressSettings();
  };'''
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Keep press plan selection in place" || exit 0
          git push
