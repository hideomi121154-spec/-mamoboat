name: Bump pilot config native scroll
on:
  push:
    paths:
      - '.github/workflows/bump-pilot-config-20260818-2.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump pilot config cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          import re
          s2, n = re.subn(r'pilot-config\.js\?v=[^"\']+', 'pilot-config.js?v=20260818-2', s)
          if n == 0:
              raise SystemExit('pilot-config.js reference not found')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh pilot config for native iOS scroll"
          git push
