name: Sync BOAT RACE data

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD（空欄はJST当日）"
        required: false
        type: string
  schedule:
    # 既存の番組表・日次成績・参考オッズ同期（15分周期）
    - cron: "*/15 0-14,21-23 * * *"
    # 終了済み未確定レースの結果画面だけを軽く確認（10分周期）
    # 毎時00分を避け、GitHub Actions混雑の影響を少し減らす。
    - cron: "7,17,27,37,47,57 0-14,21-23 * * *"
    # 前日成績の最終確認（JST 00:35 / 05:35）
    - cron: "35 15,20 * * *"

permissions:
  contents: write

concurrency:
  group: mamoboat-official-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
     - uses: actions/checkout@v4
  with:
    ref: main
    fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "7,17,27,37,47,57 0-14,21-23 * * *" ]; then
            echo "Fast-results mode uses Python standard library only"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install -r requirements.txt

      - name: Validate parser syntax
        run: python -m py_compile scripts/sync_official_data.py

      - name: Sync official data
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          FAST_RESULTS_CRON="7,17,27,37,47,57 0-14,21-23 * * *"

          if [ "$SCHEDULE" = "$FAST_RESULTS_CRON" ]; then
            # 既存JSONを土台に、締切5分後の未確定レースだけ公式結果画面を確認。
            python scripts/sync_official_data.py --fast-results-only --result-grace-minutes 5 --result-max-races 16
            exit 0
          fi

          GRADE_ARGS=()
          if [ "$(TZ=Asia/Tokyo date +%u-%H)" = "1-09" ]; then
            GRADE_ARGS+=(--refresh-grade-cache)
          fi

          if [ -n "$TARGET_DATE" ]; then
            # 日付指定の手動実行では、その場で結果画面チェックも含める。
            python scripts/sync_official_data.py --date "$TARGET_DATE" "${GRADE_ARGS[@]}"
          elif [ -z "$SCHEDULE" ]; then
            # 日付空欄の手動実行もJST当日として、結果画面チェックまで実行する。
            python scripts/sync_official_data.py "${GRADE_ARGS[@]}"
          elif [ "$SCHEDULE" = "35 15,20 * * *" ]; then
            YESTERDAY_JST="$(TZ=Asia/Tokyo date -d yesterday +%F)"
            python scripts/sync_official_data.py --date "$YESTERDAY_JST" --skip-fast-results "${GRADE_ARGS[@]}"
          else
            # 通常15分同期ではLZH・オッズを担当。結果は10分の軽量ジョブに任せる。
            # 直前に取得済みのWeb結果はsync_official_data.py側で維持する。
            python scripts/sync_official_data.py --skip-fast-results "${GRADE_ARGS[@]}"
          fi

      - name: Commit validated JSON
        run: |
          git config user.name "mamoboat-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No official data changes"
          else
            git commit -m "Update BOAT RACE official data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
