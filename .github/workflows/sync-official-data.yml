name: Sync BOAT RACE data

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD（空欄はJST当日）"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/sync_official_data.py"
      - "scripts/fallback_openapi.py"
      - ".github/workflows/sync-official-data.yml"
  schedule:
    # 既存の番組表・日次成績・参考オッズ同期（15分周期）
    - cron: "*/15 0-14,21-23 * * *"
    # JST 00:05〜05:05は毎時1回、日付が変わった当日データを先行確認する。
    # 深夜はレースがないため、10分周期の結果確認は行わない。
    - cron: "5 15-20 * * *"
    # 終了済み未確定レースの結果画面だけを軽く確認（10分周期）
    # 毎時00分を避け、GitHub Actions混雑の影響を少し減らす。
    - cron: "7,17,27,37,47,57 0-14,21-23 * * *"
    # 前日成績の最終確認（JST 00:35 / 05:35）
    - cron: "35 15,20 * * *"

permissions:
  contents: write

concurrency:
  group: mamoboat-official-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The downloader rejects dates after the runner's local day. GitHub-hosted
      # runners use UTC, so pin the whole job to JST before the date rolls over.
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "7,17,27,37,47,57 0-14,21-23 * * *" ]; then
            echo "Fast-results mode uses Python standard library only"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install -r requirements.txt

      - name: Validate parser syntax
        run: |
          python -m py_compile scripts/sync_official_data.py
          python -m py_compile scripts/fallback_openapi.py

      - name: Sync official data
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          FAST_RESULTS_CRON="7,17,27,37,47,57 0-14,21-23 * * *"

          if [ "$SCHEDULE" = "$FAST_RESULTS_CRON" ]; then
            # 既存JSONを土台に、締切5分後の未確定レースだけ公式結果画面を確認。
            python scripts/sync_official_data.py --fast-results-only --result-grace-minutes 5 --result-max-races 16
            exit 0
          fi

          GRADE_ARGS=()
          if [ "$(TZ=Asia/Tokyo date +%u-%H)" = "1-09" ]; then
            GRADE_ARGS+=(--refresh-grade-cache)
          fi

          if [ -n "$TARGET_DATE" ]; then
            # 日付指定の手動実行では、その場で結果画面チェックも含める。
            python scripts/sync_official_data.py --date "$TARGET_DATE" "${GRADE_ARGS[@]}"
          elif [ -z "$SCHEDULE" ]; then
            # 日付空欄の手動実行もJST当日として、結果画面チェックまで実行する。
            python scripts/sync_official_data.py "${GRADE_ARGS[@]}"
          elif [ "$SCHEDULE" = "35 15,20 * * *" ]; then
            YESTERDAY_JST="$(TZ=Asia/Tokyo date -d yesterday +%F)"
            python scripts/sync_official_data.py --date "$YESTERDAY_JST" --skip-fast-results "${GRADE_ARGS[@]}"
          else
            # 通常15分同期ではLZH・オッズを担当。結果は10分の軽量ジョブに任せる。
            python scripts/sync_official_data.py --skip-fast-results "${GRADE_ARGS[@]}"
          fi

      - name: Recover stale JST current-day data
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 履歴日を指定した手動実行と、前日成績の最終確認ではtoday.jsonを触らない。
          if [ -n "$TARGET_DATE" ]; then
            echo "Historical/manual target: skip current-day fallback"
            exit 0
          fi
          if [ "$SCHEDULE" = "35 15,20 * * *" ]; then
            echo "Yesterday-finalization cron: skip current-day fallback"
            exit 0
          fi
          python scripts/fallback_openapi.py

      - name: Mirror official data into dev
        run: |
          # /dev is a separate GitHub Pages path. Keep its data copy identical to
          # production so the development UI never gets stuck on yesterday's JSON.
          mkdir -p dev/data
          cp -a data/. dev/data/

      - name: Commit validated JSON
        run: |
          git config user.name "mamoboat-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dev/data
          if git diff --cached --quiet; then
            echo "No official data changes"
          else
            git commit -m "Update BOAT RACE official data"
            for attempt in 1 2 3 4; do
              echo "Push attempt ${attempt}/4"
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Push failed after 4 attempts"
            exit 1
          fi
