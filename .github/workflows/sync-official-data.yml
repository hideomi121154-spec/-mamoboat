name: Sync BOAT RACE data

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD（空欄はJST当日）"
        required: false
        type: string
  schedule:
    - cron: "15 0-14,21-23 * * *"
    - cron: "35 15,20 * * *"

permissions:
  contents: write

concurrency:
  group: mamoboat-official-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install -r requirements.txt

      - name: Validate parser syntax
        run: python -m py_compile scripts/sync_official_data.py

      - name: Sync official daily archives
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/sync_official_data.py --date "$TARGET_DATE"
          elif [ "$SCHEDULE" = "35 15,20 * * *" ]; then
            YESTERDAY_JST="$(TZ=Asia/Tokyo date -d yesterday +%F)"
            python scripts/sync_official_data.py --date "$YESTERDAY_JST"
          else
            python scripts/sync_official_data.py
          fi

      - name: Commit validated JSON
        run: |
          git config user.name "mamoboat-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No official data changes"
          else
            git commit -m "Update BOAT RACE official data"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
