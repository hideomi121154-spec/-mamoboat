name: Repair BOAT RACE kimarite

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD（空欄はJST当日）"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/repair_kimarite.py"
      - ".github/workflows/repair-kimarite.yml"
  schedule:
    # Existing fast-result sync runs at :07/:17/... . Repair result detail two minutes later.
    - cron: "9,19,29,39,49,59 0-14,21-23 * * *"

permissions:
  contents: write

concurrency:
  group: mamoboat-official-data-sync
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install beautifulsoup4

      - name: Validate repair scripts
        run: |
          python -m py_compile scripts/sync_official_data.py
          python -m py_compile scripts/repair_kimarite.py

      - name: Refresh settled official results first
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          # Kimarite can only be repaired after the corresponding official result
          # has been stored in data/today.json. Refresh all ended candidates first
          # so an intermediate race such as Tsu 4R is not skipped by the small
          # fast-result batch used by the normal 10-minute sync.
          if [ -n "$TARGET_DATE" ]; then
            python scripts/sync_official_data.py \
              --date "$TARGET_DATE" \
              --fast-results-only \
              --result-grace-minutes 5 \
              --result-max-races 96
          else
            python scripts/sync_official_data.py \
              --fast-results-only \
              --result-grace-minutes 5 \
              --result-max-races 96
          fi

      - name: Repair missing kimarite
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/repair_kimarite.py --date "$TARGET_DATE" --max-races 96
          else
            python scripts/repair_kimarite.py --max-races 96
          fi

      - name: Mirror official data into dev
        run: |
          mkdir -p dev/data
          cp -a data/. dev/data/

      - name: Commit repaired official detail
        run: |
          git config user.name "mamoboat-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dev/data
          if git diff --cached --quiet; then
            echo "No kimarite changes"
            exit 0
          fi
          git commit -m "Repair BOAT RACE kimarite"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
