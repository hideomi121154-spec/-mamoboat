name: Repair BOAT RACE kimarite

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD（空欄はJST当日）"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/repair_kimarite.py"
      - "scripts/repair_race_carte_environment.py"
      - ".github/workflows/repair-kimarite.yml"
  schedule:
    # During active race hours, refresh ended races every 5 minutes.
    # This reduces the window where a settled Race Carte can show 未保存.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-14,21-23 * * *"

permissions:
  contents: write

concurrency:
  group: mamoboat-official-data-sync
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install beautifulsoup4

      - name: Validate repair scripts
        run: |
          python -m py_compile scripts/sync_official_data.py
          python -m py_compile scripts/repair_kimarite.py
          python -m py_compile scripts/repair_race_carte_environment.py

      - name: Refresh settled official results first
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          # Refresh all ended candidates first. A large batch prevents a race from
          # being skipped when many venues settle around the same time.
          if [ -n "$TARGET_DATE" ]; then
            python scripts/sync_official_data.py \
              --date "$TARGET_DATE" \
              --fast-results-only \
              --result-grace-minutes 3 \
              --result-max-races 144
          else
            python scripts/sync_official_data.py \
              --fast-results-only \
              --result-grace-minutes 3 \
              --result-max-races 144
          fi

      - name: Repair missing kimarite
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/repair_kimarite.py --date "$TARGET_DATE" --max-races 144 --sleep 0.03
          else
            python scripts/repair_kimarite.py --max-races 144 --sleep 0.03
          fi

      - name: Repair missing Race Carte environment
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          # The normal preview collector only watches a narrow close-time window.
          # Revisit finished races so missed weather/wind/wave/temperature fields
          # do not remain 未保存 forever.
          if [ -n "$TARGET_DATE" ]; then
            python scripts/repair_race_carte_environment.py --date "$TARGET_DATE" --max-races 48 --sleep 0.03
          else
            python scripts/repair_race_carte_environment.py --max-races 48 --sleep 0.03
          fi

      - name: Mirror official data into dev
        run: |
          mkdir -p dev/data
          cp -a data/. dev/data/

      - name: Commit repaired official detail
        run: |
          git config user.name "mamoboat-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dev/data
          if git diff --cached --quiet; then
            echo "No Race Carte detail changes"
            exit 0
          fi
          git commit -m "Repair BOAT RACE Race Carte detail"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
