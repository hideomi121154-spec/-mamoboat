name: Fix membership anchor position

on:
  push:
    paths:
      - '.github/workflows/fix-plan-anchor-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve membership panel viewport position
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const scrollTop = window.scrollY;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => window.scrollTo(0, scrollTop));
  };'''
          new='''    trackEvent("pilot_plan_selected", { plan: key, billing_started: false });
    const panel = $("membershipPanel");
    const anchorTop = panel ? panel.getBoundingClientRect().top : null;
    save();
    window.closeModal();
    renderPressroom();
    requestAnimationFrame(() => {
      if (anchorTop == null) return;
      const nextPanel = $("membershipPanel");
      if (!nextPanel) return;
      const nextTop = nextPanel.getBoundingClientRect().top;
      window.scrollBy(0, nextTop - anchorTop);
    });
  };'''
          if old not in s:
              raise SystemExit('selectPilotPlan anchor block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('app.js?v=20260817-32','app.js?v=20260817-33')
          idx.write_text(h,encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Keep membership panel fixed while switching plan"
          git push
